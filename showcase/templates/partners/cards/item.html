{% extends "partials/cards/base.html" %}

{% block card_classes %}modern-card h-100 border-0 shadow{% endblock %}
{% block card_body_classes %}p-0 h-100{% endblock %}

{% block card_body %}
<div class="row g-0 h-100">
    <div class="col-sm-4 d-flex align-items-center justify-content-center p-3" style="background: #f8f9fa;">
        <img src="{{item.icon_url}}" class="img-fluid rounded" alt="{{item.name}}"
            style="max-height: 180px; object-fit: contain;">
    </div>
    <div class="col-sm-8">
        <div class="card-body d-flex flex-column h-100 p-4">
            <h5 class="card-title fw-bold mb-2">{{item.name}}</h5>
            <p class="card-text text-muted flex-grow-1 mb-3">
                {{item.description}}
            </p>
            {% if item.url %}
            <a href="{{item.url}}" class="btn btn-primary btn-sm" target="_blank">
                En savoir plus
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
