name: CI
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  tests:
    runs-on: self-hosted
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: "dev"
          MARIADB_USER: "dev"
          MARIADB_PASSWORD: bdeutt_test
          MYSQL_RANDOM_ROOT_PASSWORD: yes
        ports:
          - 3306:3306
        # options: --name mariadb --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=30s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Django DB env
        run: |
          echo "DJANGO_DB_NAME=testdb" >> $GITHUB_ENV
          echo "DJANGO_DB_USER=testuser" >> $GITHUB_ENV
          echo "DJANGO_DB_PASSWORD=testpass" >> $GITHUB_ENV
          echo "DJANGO_DB_HOST=localhost" >> $GITHUB_ENV
          echo "DJANGO_DB_PORT=3306" >> $GITHUB_ENV

      - name: Run Django tests
        env:
          DJANGO_DB_NAME: ${{ env.DJANGO_DB_NAME }}
          DJANGO_DB_USER: ${{ env.DJANGO_DB_USER }}
          DJANGO_DB_PASSWORD: ${{ env.DJANGO_DB_PASSWORD }}
          DJANGO_DB_HOST: ${{ env.DJANGO_DB_HOST }}
          DJANGO_DB_PORT: ${{ env.DJANGO_DB_PORT }}
        run: python manage.py test

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    needs:
      - tests
      - build
    steps:
      - uses: actions/checkout@v4

      - name: Install docker
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/bde_utt/bde_utt:${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
