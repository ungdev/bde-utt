<section class="py-5" style="background-color: #314069;">
    <a href="/partners" class="h2-link">
        <h2 class="text-center mb-4 text-light">Nos partenaires</h2>
    </a>
    <div class="d-flex justify-content-center align-items-center flex-wrap row-gap-3">
        {% for item in partners_qs %}
        <div id="partner_{{item.id}}" class="partner-card d-inline-block mx-2 cursor-pointer"
            style="vertical-align: top;">
            <div class="card bg-light text-dark" style="width: 180px;">
                <img src="{{item.icon_url}}" class="card-img-top rounded shadow" alt="{{item.name}}"
                    style="height: 120px; object-fit: contain;">
                <div class="card-body text-center">
                    <h6 class="card-title mb-0">{{item.name}}</h6>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="partner-infos-container"
        class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 justify-content-center align-items-center"
        style="z-index: 500">
        <div id="partner-infos" class="card position-relative"
            style="max-width: 400px; margin: 20px auto;z-index: 501;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span id="partner-name">Nom du partenaire</span>
                <button id="partner-infos-close-btn" type="button" class="btn-close" aria-label="Fermer"></button>
            </div>
            <img id="partner-logo" src="" class="card-img-top rounded shadow mt-2" alt="Logo partenaire"
                style="height: 120px; object-fit: contain;">
            <div class="card-body">
                <p id="partner-description">Description du partenaire...</p>
                <div class="d-flex justify-content-center">
                    <a id="partner-url" href="#" class="btn btn-primary mt-2" target="_blank">En savoir plus</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/partners.js"></script>
    <script type="text/javascript">
        window.partners = JSON.parse('{{ partners_json| escapejs}}');
    </script>
    <link href="/static/css/partners.css" rel="stylesheet">

</section>
